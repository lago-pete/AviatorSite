<!DOCTYPE html>
<html>
<head><title>Flight Dashboard</title></head>
<body>
  <h1>Dashboard test</h1>
  <div id="dashboard"></div>
  <script>
    const socket = new WebSocket("ws://10.42.0.1:8080");
    socket.onopen = () => console.log("connected");
    socket.onmessage = (event) => {
      console.log(event.data);
      const jsonObject = JSON.parse(event.data);

    document.getElementById("dashboard").innerHTML = `
      <p>Flight Number: ${jsonObject.flightNumber}</p>
      <p>Altitude: ${jsonObject.altitude}</p>
      <p>Speed: ${jsonObject.speed}</p>
    `;
    };
  </script>
</body>
</html>
