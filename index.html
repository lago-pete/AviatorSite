<!doctype html>
<html>
  <head>
    <title>Flight Dashboard</title>
    <style>
      /* let the horizon ball ease between packets instead of snapping */
      #attitude_ball,
      #attitude_pitch {
        transition: transform 0.1s linear;
      }
    </style>
  </head>

  <body>
    <h1>Dashboard test</h1>
    <div id="dashboard"></div>
    <svg width="200" height="200">
      <circle cx="100" cy="100" r="80" stroke="black" fill="none" />
      <line
        id="heading_needle"
        x1="100"
        y1="100"
        x2="100"
        y2="30"
        stroke="red"
        stroke-width="3"
        transform="rotate(45 100 100)"
      />
    </svg>
    <svg width="200" height="200">
      <circle cx="100" cy="100" r="80" stroke="black" fill="none" />
      <line
        id="altitude_needle"
        x1="100"
        y1="100"
        x2="100"
        y2="30"
        stroke="red"
        stroke-width="3"
        transform="rotate(45 100 100)"
      />
    </svg>
    
    


    <svg width="200" height="200">
      <defs>
        <clipPath id = "attitude_window">
          <circle cx="100" cy="100" r="80"/>
        </clipPath>
      </defs>
      <g clip-path="url(#attitude_window)">
        <g id = "attitude_ball" transform = "rotate(0,100,100)">
          <g id = "attitude_pitch" transform = "translate(0,0)">
            <rect x="-200" y="-200" width="600" height="300" fill="#4aa3df" />
            <rect x="-200" y="100" width="600" height="300" fill="#8a6240" />
            <line x1="-200" y1="100" x2="400" y2="100" stroke="white" stroke-width="2" />
          </g>
        </g>
      </g>
      <line x1="70" y1="100" x2="130" y2="100" stroke="white" stroke-width="4" /> 
      <circle cx="100" cy="100" r="3" fill="white" />
      <circle cx="100" cy="100" r="80" stroke="black" fill="none" stroke-width="2" />
    </svg>




    <script>
      const socket = new WebSocket("ws://10.42.0.1:8080");
      socket.onopen = () => console.log("connected");
      const heading_needle = document.getElementById("heading_needle");
      const altitude_needle = document.getElementById("altitude_needle");
      const attitude_ball = document.getElementById("attitude_ball");
      const attitude_pitch = document.getElementById("attitude_pitch");
      const min_value = 0;
      const max_value = 400;
      const min_angle = -120;
      const max_angle = 120;
      let calculated_altitude = 0;
      let altitude = 0;
      let diff = 0;
      let new_heading = 0;
      let last_heading = 0;
      let acumulated_diff = 0;
      let gpsTimeCheck = { hour: 0, minute: 0, sec: 0 };

      function updateAttitude(roll,pitch){
          attitude_ball.setAttribute("transform", `rotate(${roll},100,100)`);
          attitude_pitch.setAttribute("transform", `translate(0,${pitch})`);
      }

      



      socket.onmessage = (event) => {
        console.log(event.data);
        function isValidJSON(str) {
          try {
            const jsonObject = JSON.parse(event.data);
            if (jsonObject.gps.valid === false) {
              console.log("Invalid GPS Reading.");
            } else {
              console.log(jsonObject);
            }
            return jsonObject;
          } catch (error) {
            console.log("Error parsing JSON: ", error);
            return;
          }
        }
        const jsonObject = isValidJSON(event.data);
        if (!jsonObject) {
          console.log("Received invalid JSON data.");
          return;
        } else {
          console.log("Received valid JSON data.");
          altitude = jsonObject.gps.altitude;
          calculated_altitude =
            ((altitude - min_value) / (max_value - min_value)) *
              (max_angle - min_angle) +
            min_angle;
          new_heading = jsonObject.compass.headingDegrees;

          if (!jsonObject.mpu.valid) {
            console.log("!!!MPU Reading Not Valid!!! " + jsonObject.mpu.accelX);
            console.log("--- MPU ---");
            console.log("Accel X: " + "--------------------");
            console.log("Accel Y: " + "--------------------");
            console.log("Accel Z: " + "--------------------");
            console.log("Temp: " + "--------------------");
            console.log("Gyro X: " + "--------------------");
            console.log("Gyro Y: " + "--------------------");
            console.log("Gyro Z: " + "--------------------");
            console.log("Valid: " + "--------------------");
          } else {
            console.log("--- MPU ---");
            console.log("Accel X: " + jsonObject.mpu.accelX);
            console.log("Accel Y: " + jsonObject.mpu.accelY);
            console.log("Accel Z: " + jsonObject.mpu.accelZ);
            console.log("Temp: " + jsonObject.mpu.temp);
            console.log("Gyro X: " + jsonObject.mpu.gyroX);
            console.log("Gyro Y: " + jsonObject.mpu.gyroY);
            console.log("Gyro Z: " + jsonObject.mpu.gyroZ);
            console.log("Valid: " + jsonObject.mpu.valid);
            updateAttitude(jsonObject.mpu.roll, jsonObject.mpu.pitch);
          }

          if (!jsonObject.bme.valid) {
            console.log("!!!!BME Reading Not Valid!!!!");
            console.log("Temperature: " + "--------------------");
            console.log("Humidity: " + "--------------------");
            console.log("Pressure: " + "--------------------");
            console.log("Gas Resistance: " + "--------------------");
            console.log("Valid: " + "--------------------");
          } else {
            console.log("--- BME ---");
            console.log("Temperature: " + jsonObject.bme.temperature);
            console.log("Humidity: " + jsonObject.bme.humidity);
            console.log("Pressure: " + jsonObject.bme.pressure);
            console.log("Gas Resistance: " + jsonObject.bme.gasResistance);
            console.log("Valid: " + jsonObject.bme.valid);
          }

          if (!jsonObject.compass.valid) {
            console.log("!!!!Compass Reading Not Valid!!!!");
            console.log("Heading Degrees: " + "--------------------");
            console.log("Raw X: " + "--------------------");
            console.log("Raw Y: " + "--------------------");
            console.log("Raw Z: " + "--------------------");
            console.log("Valid: " + "--------------------");
          } else {
            console.log("--- Compass ---");
            console.log(
              "Heading Degrees: " + jsonObject.compass.headingDegrees,
            );
            console.log("Raw X: " + jsonObject.compass.rawX);
            console.log("Raw Y: " + jsonObject.compass.rawY);
            console.log("Raw Z: " + jsonObject.compass.rawZ);
            console.log("Valid: " + jsonObject.compass.valid);
          }

          if (
            jsonObject.gps.time.hour === 0 &&
            jsonObject.gps.time.minute === 0 &&
            jsonObject.gps.time.sec === 0
          ) {
            console.log("!!!!GPS Reading Not Valid!!!!");
            console.log(
              "Lat: " + "--------------------" + " " + "--------------------",
            );
            console.log(
              "Lon: " + "--------------------" + " " + "--------------------",
            );
            console.log("Fix Quality: " + "--------------------");
            console.log("Sat Count: " + "--------------------");
            console.log("HDOP: " + "--------------------");
            console.log("Altitude: " + "--------------------");
            console.log("Speed (MPH): " + "--------------------");
            console.log(
              "Time: " +
                jsonObject.gps.time.hour +
                ":" +
                jsonObject.gps.time.minute +
                ":" +
                jsonObject.gps.time.sec,
            );
          } else if (
            gpsTimeCheck.hour === jsonObject.gps.time.hour &&
            gpsTimeCheck.minute === jsonObject.gps.time.minute &&
            gpsTimeCheck.sec === jsonObject.gps.time.sec
          ) {
            console.log("!!!!Last Known GPS Reading!!!!");
            console.log(
              "Lat: " + jsonObject.gps.lat + " " + jsonObject.gps.latDir,
            );
            console.log(
              "Lon: " + jsonObject.gps.lon + " " + jsonObject.gps.lonDir,
            );
            console.log("Fix Quality: " + jsonObject.gps.fixQual);
            console.log("Sat Count: " + jsonObject.gps.satCount);
            console.log("HDOP: " + jsonObject.gps.hdop);
            console.log("Altitude: " + jsonObject.gps.altitude);
            console.log("Speed (MPH): " + jsonObject.gps.speedKnots * 1.15078);
            console.log(
              "Time: " +
                jsonObject.gps.time.hour +
                ":" +
                jsonObject.gps.time.minute +
                ":" +
                jsonObject.gps.time.sec,
            );
          } else {
            ///need to check if its stale and indicate if it stale and if so display last known location.
            console.log("--- GPS ---");
            console.log(
              "Lat: " + jsonObject.gps.lat + " " + jsonObject.gps.latDir,
            );
            console.log(
              "Lon: " + jsonObject.gps.lon + " " + jsonObject.gps.lonDir,
            );
            console.log("Fix Quality: " + jsonObject.gps.fixQual);
            console.log("Sat Count: " + jsonObject.gps.satCount);
            console.log("HDOP: " + jsonObject.gps.hdop);
            console.log("Altitude: " + jsonObject.gps.altitude);
            console.log("Speed (MPH): " + jsonObject.gps.speedKnots * 1.15078);
            console.log(
              "Time: " +
                jsonObject.gps.time.hour +
                ":" +
                jsonObject.gps.time.minute +
                ":" +
                jsonObject.gps.time.sec,
            );
            gpsTimeCheck = jsonObject.gps.time;
          }
          console.log("");

          diff = new_heading - last_heading;
          if (diff > 180) {
            diff -= 360;
          }
          if (diff < -180) {
            diff += 360;
          }
          last_heading = new_heading;
          acumulated_diff += diff;
        }

        

        heading_needle.setAttribute(
          "transform",
          `rotate(${acumulated_diff},100,100)`,
        );
        altitude_needle.setAttribute(
          "transform",
          `rotate(${calculated_altitude},100,100)`,
        );
      };
    </script>
  </body>
</html>
